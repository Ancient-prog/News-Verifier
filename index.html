<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Verifier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI News Verifier</h1>
        <p>Paste a news snippet below to check its credibility.</p>
        
        <textarea id="newsInput" placeholder="Enter news article text here..."></textarea>
        
        <button id="analyzeBtn" onclick="detectFakeNews()">
            <span id="btnText">Analyze News</span>
            <div id="spinner" class="spinner" style="display: none;"></div>
        </button>

        <div id="result" class="result-box hidden"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
